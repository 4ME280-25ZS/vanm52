<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d5b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0b8a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGrad">
      <stop offset="0%" style="stop-color:#4a3728;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2416;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hair back -->
  <ellipse cx="100" cy="70" rx="50" ry="55" fill="url(#hairGrad)"/>
  
  <!-- Head/Face -->
  <ellipse cx="100" cy="100" rx="48" ry="55" fill="url(#skinGrad)"/>
  
  <!-- Neck -->
  <rect x="90" y="145" width="20" height="35" fill="url(#skinGrad)"/>
  
  <!-- Shirt -->
  <path d="M 75 175 L 50 200 L 150 200 L 125 175 Q 100 180 75 175" fill="#4a7ba7"/>
  
  <!-- Eyes whites -->
  <ellipse cx="80" cy="85" rx="10" ry="13" fill="#ffffff"/>
  <ellipse cx="120" cy="85" rx="10" ry="13" fill="#ffffff"/>
  
  <!-- Iris -->
  <circle cx="80" cy="88" r="7" fill="#5b4423"/>
  <circle cx="120" cy="88" r="7" fill="#5b4423"/>
  
  <!-- Pupils -->
  <circle cx="80" cy="88" r="4" fill="#1a1a1a"/>
  <circle cx="120" cy="88" r="4" fill="#1a1a1a"/>
  
  <!-- Eye shine -->
  <circle cx="82" cy="86" r="2" fill="#ffffff"/>
  <circle cx="122" cy="86" r="2" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 70 72 Q 80 68 90 72" stroke="#3d2f23" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 110 72 Q 120 68 130 72" stroke="#3d2f23" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 100 85 L 100 105" stroke="#d4b09f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="97" cy="107" rx="2.5" ry="3" fill="#d4b09f"/>
  <ellipse cx="103" cy="107" rx="2.5" ry="3" fill="#d4b09f"/>
  
  <!-- Mouth -->
  <path d="M 85 125 Q 100 133 115 125" stroke="#c49080" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks/blush -->
  <ellipse cx="65" cy="100" rx="12" ry="8" fill="#f5a89a" opacity="0.4"/>
  <ellipse cx="135" cy="100" rx="12" ry="8" fill="#f5a89a" opacity="0.4"/>
  
  <!-- Light reflection on face -->
  <ellipse cx="70" cy="75" rx="25" ry="30" fill="#ffffff" opacity="0.12"/>
</svg>