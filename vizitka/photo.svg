<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c9a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f08;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eyeLight">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#skinGradient)" opacity="0.1"/>
  
  <!-- Hair -->
  <path d="M 60 80 Q 60 40 100 35 Q 140 40 140 80 L 140 100 Q 140 95 100 92 Q 60 95 60 100 Z" fill="url(#hairGradient)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="105" rx="45" ry="50" fill="url(#skinGradient)"/>
  
  <!-- Ears -->
  <ellipse cx="58" cy="100" rx="12" ry="18" fill="url(#skinGradient)"/>
  <ellipse cx="142" cy="100" rx="12" ry="18" fill="url(#skinGradient)"/>
  
  <!-- Neck -->
  <rect x="88" y="145" width="24" height="30" fill="url(#skinGradient)"/>
  
  <!-- Shoulders/Shirt -->
  <path d="M 70 175 L 60 195 L 140 195 L 130 175 Q 100 180 70 175 Z" fill="#3a5a7f"/>
  
  <!-- Eyes -->
  <g id="leftEye">
    <ellipse cx="82" cy="95" rx="8" ry="12" fill="#4a4a4a"/>
    <ellipse cx="82" cy="95" rx="5" ry="8" fill="#1a1a1a"/>
    <circle cx="84" cy="92" r="3" fill="url(#eyeLight)"/>
  </g>
  
  <g id="rightEye">
    <ellipse cx="118" cy="95" rx="8" ry="12" fill="#4a4a4a"/>
    <ellipse cx="118" cy="95" rx="5" ry="8" fill="#1a1a1a"/>
    <circle cx="120" cy="92" r="3" fill="url(#eyeLight)"/>
  </g>
  
  <!-- Eyebrows -->
  <path d="M 72 82 Q 82 78 92 82" stroke="#2c1810" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 108 82 Q 118 78 128 82" stroke="#2c1810" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 100 95 L 100 115" stroke="#c9a889" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="97" cy="116" rx="3" ry="4" fill="#c9a889"/>
  <ellipse cx="103" cy="116" rx="3" ry="4" fill="#c9a889"/>
  
  <!-- Mouth -->
  <path d="M 85 125 Q 100 135 115 125" stroke="#a0826d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Subtle facial features -->
  <ellipse cx="70" cy="110" rx="8" ry="6" fill="#d4a574" opacity="0.3"/>
  <ellipse cx="130" cy="110" rx="8" ry="6" fill="#d4a574" opacity="0.3"/>
  
  <!-- Highlight on face for dimension -->
  <ellipse cx="75" cy="85" rx="20" ry="25" fill="#ffffff" opacity="0.08"/>
</svg>