<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Osobní vizitka — Jméno Příjmení</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <meta name="description" content="Osobní vizitka — Jméno Příjmení, vývojář, kontakt" />
</head>
<body>
  <main class="card simple-card">
    <div class="avatar-wrap">
      <img class="avatar-photo" src="photo.jpg" alt="Tomáš Novák — portrét">
    </div>
    <h1 class="name">Tomáš Novák</h1>
    <p class="role">Fotograf — svatby & portréty</p>

    <div class="contact-buttons">
      <a class="btn" href="mailto:kontakt@novakphoto.cz"><i class="fas fa-envelope"></i> kontakt@novakphoto.cz</a>
      <a class="btn btn-outline" href="https://instagram.com/novakphoto" target="_blank" rel="noopener"><i class="fab fa-instagram"></i> @novakphoto</a>
      <a class="btn btn-outline" href="https://linkedin.com/in/tomasnovak" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i> Tomáš Novák</a>
    </div>

    <footer class="card-foot">
      <small>© <span id="year"></span> Tomáš Novák</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
