<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seznam Darů 🎁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header s tvým zvířátkem -->
        <header class="header">
            <h1>💝 Váš seznam přání</h1>
            <div class="user-animal">
                <span>Ty jsi:</span>
                <span class="animal-display" id="myAnimal">🐯</span>
            </div>
        </header>

        <!-- Vysvětlení -->
        <div class="info-box">
            <p>👇 <strong>Jak to funguje:</strong> Vyberte si dary, které byste chtěli koupit. Kliknutím na "Koupit" si dar zamluvíte pod svým zvířátkem. Ostatní uvidí, že je dar zabraný. Kdykoliv si to můžete rozmyslet a koupi zrušit.</p>
        </div>

        <!-- Hlavní obsah -->
        <main class="gifts-grid" id="giftsGrid">
            <!-- Karty se budou generovat JavaScriptem -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
