<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Projekty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .project-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .project-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .project-description {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .project-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s ease;
            align-self: flex-start;
        }

        .project-link:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>� Projekty od vanm52</h1>
            <p>Zkouška různých web projektů a konceptů</p>
        </div>

        <div class="projects-grid">
            <!-- Vizitka projekt -->
            <a href="vizitka/" class="project-card">
                <div class="project-icon">👤</div>
                <div class="project-title">Vizitka - Template</div>
                <div class="project-description">
                    Moderní vizitka s fotkou, kontakty a sociálními sítěmi.
                </div>
                <span class="project-link">→ Otevřít vizitku</span>
            </a>

            <!-- Wishlist projekt -->
            <a href="wishlist/" class="project-card">
                <div class="project-icon">🎁</div>
                <div class="project-title">Seznam Přání</div>
                <div class="project-description">
                    Interaktivní seznam darů se synchronizací přes Supabase a multi-device podporou.
                </div>
                <span class="project-link">→ Otevřít seznam</span>
            </a>
        </div>
    </div>
</body>
</html>
